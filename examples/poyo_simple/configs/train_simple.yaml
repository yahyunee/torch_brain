# Simple POYO training config
# This is optional - train_simple.py works without Hydra

# Dataset
dataset:
  num_units: 50
  num_samples: 1000
  sequence_length: 1.0
  firing_rate: 10.0
  output_dim: 2

# Model
model:
  dim: 128
  depth: 2
  heads: 4
  dim_head: 32
  latent_step: 0.1
  num_latents_per_step: 8
  dropout: 0.1

# Training
training:
  num_epochs: 50
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0

# Misc
seed: 42
device: auto  # auto, cuda, cpu
