# Test config for minimal HDF5 - Round 2
# Tests if pipeline works WITHOUT: running, running_domain (in addition to r1 deletions)

defaults:
  - defaults.yaml
  - model: capoyo_single_session.yaml
  - dataset: capoyo_single_session_r2.yaml
  - _self_

epochs: 2  # Just 2 epochs for testing
batch_size: 64

train_transforms:
  - _target_: torch_brain.transforms.UnitDropout
    field: "calcium_traces.df_over_f"
    min_units: 10
    mode_units: 50
    max_units: 300
    tail_right: 100

wandb:
  run_name: capoyo_single_session_r2_test
